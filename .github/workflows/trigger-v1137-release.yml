name: Trigger V1.13.7 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-v1137-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
