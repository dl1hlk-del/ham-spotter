# This workflow validates the latest public release after reliability changes.
name: Installation Smoke Test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (leave empty for latest)'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean install from public release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Select release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_EVENT_TAG:-}" ]]; then
            TAG="$RELEASE_EVENT_TAG"
          elif [[ -n "${MANUAL_TAG:-}" ]]; then
            TAG="$MANUAL_TAG"
          else
            TAG="$(python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print(json.load(response)["tag_name"])
          PY
          )"
          fi
          echo "Testing release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download public release assets
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl -fL --retry 3 --retry-delay 2 "$BASE/hamspotter-installer.sh" -o hamspotter-installer.sh
          curl -fL --retry 3 --retry-delay 2 "$BASE/ham-spotter-universal.zip" -o ham-spotter-universal.zip
          curl -fL --retry 3 --retry-delay 2 "$BASE/SHA256SUMS.txt" -o SHA256SUMS.txt
          chmod +x hamspotter-installer.sh

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          ./hamspotter-installer.sh --verify

      - name: Verify Docker environment
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Run clean installation
        shell: bash
        run: |
          set -euo pipefail
          # Prompt order:
          # language, install dir, callsign, locator, confirm, HF, VHF,
          # mode, port, radius, timezone, Telegram.
          # Two leading newlines select English and the default install directory.
          printf '\n\nDL0TEST\nJO00AA\n\n\n\n1\n18095\n325\nEtc/UTC\nn\n' \
            | ./hamspotter-installer.sh

      - name: Verify installed service
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18095/health > health.json; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo 'Health endpoint did not become ready.' >&2
              docker logs ham-spotter || true
              exit 1
            fi
            sleep 2
          done
          cat health.json
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          test "$(hamspotter version)" = "$EXPECTED_VERSION"
          python3 - "$EXPECTED_VERSION" <<'PY'
          import json, sys
          expected = sys.argv[1]
          with open('health.json', encoding='utf-8') as fh:
              health = json.load(fh)
          assert health.get('version') == expected, (health.get('version'), expected)
          PY
          grep -q '^HAMSPOTTER_LANGUAGE=en$' "$HOME/ham-spotter/.env"
          hamspotter about | tee about.txt
          grep -q "Version: $EXPECTED_VERSION" about.txt
          grep -q 'DL1HLK' about.txt
          grep -q 'GPL-3.0-only' about.txt

          DOCKER_HEALTH=""
          for attempt in $(seq 1 30); do
            DOCKER_HEALTH="$(docker inspect --format '{{.State.Health.Status}}' ham-spotter)"
            echo "Docker health: $DOCKER_HEALTH"
            if [[ "$DOCKER_HEALTH" == "healthy" ]]; then
              break
            fi
            if [[ "$DOCKER_HEALTH" == "unhealthy" ]]; then
              docker logs ham-spotter || true
              exit 1
            fi
            sleep 2
          done
          test "$DOCKER_HEALTH" = "healthy"
          docker ps --filter name=ham-spotter

      - name: Verify RBN node directory
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:18095/health > rbn-health.json; then
              if python3 - <<'PY'
          import json, sys
          with open('rbn-health.json', encoding='utf-8') as fh:
              health = json.load(fh)
          source = next((x for x in health.get('sources', []) if x.get('source') == 'rbn_nodes'), {})
          status = source.get('status')
          count = int(health.get('rbn_nodes') or 0)
          print(f'RBN nodes: status={status} count={count}')
          raise SystemExit(0 if status == 'LIVE' and count > 0 else 1)
          PY
              then
                break
              fi
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo 'RBN node directory did not become LIVE with a non-empty node set.' >&2
              cat rbn-health.json || true
              docker logs ham-spotter || true
              exit 1
            fi
            sleep 2
          done

      - name: Verify public self-update handoff
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          UPDATE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/ham-spotter-universal.zip"
          cd "$HOME/ham-spotter"
          hamspotter update "$UPDATE_URL" | tee "$GITHUB_WORKSPACE/self-update.log"

          EXPECTED_VERSION="${RELEASE_TAG#v}"
          grep -q "Handing update over to HAM Spotter ${EXPECTED_VERSION}" "$GITHUB_WORKSPACE/self-update.log"
          grep -q 'Waiting for container health' "$GITHUB_WORKSPACE/self-update.log"
          grep -q 'Container is healthy and Web/API is ready.' "$GITHUB_WORKSPACE/self-update.log"
          grep -q "Update complete. Installed version: ${EXPECTED_VERSION}" "$GITHUB_WORKSPACE/self-update.log"

          test "$(hamspotter version)" = "$EXPECTED_VERSION"
          test "$(docker inspect --format '{{.State.Health.Status}}' ham-spotter)" = "healthy"
          curl -fsS --max-time 5 http://127.0.0.1:18095/health > "$GITHUB_WORKSPACE/self-update-health.json"
          python3 - "$EXPECTED_VERSION" "$GITHUB_WORKSPACE/self-update-health.json" <<'PY'
          import json, sys
          expected, path = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as fh:
              health = json.load(fh)
          assert health.get('ok') is True
          assert health.get('version') == expected, (health.get('version'), expected)
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -d "$HOME/ham-spotter" ]]; then
            cd "$HOME/ham-spotter"
            docker compose down --remove-orphans
          fi
          sudo rm -f /usr/local/bin/hamspotter
          rm -rf "$HOME/ham-spotter"
