name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Full test suite
        run: PYTHONPATH=. pytest -q

      - name: Python syntax
        run: python -m py_compile app/main.py app/rbn_nodes.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py tools/build_release.py

      - name: Shell syntax
        run: bash -n install.sh hamspotter upgrade.sh upgrade_v*.sh

      - name: Release packaging smoke test
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py --output /tmp/hamspotter-dist
          cd /tmp/hamspotter-dist
          sha256sum -c SHA256SUMS.txt
          bash -n hamspotter-installer.sh
          ./hamspotter-installer.sh --verify
          unzip -t ham-spotter-universal.zip
