name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Current regression suite
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_v111_decision.py \
            tests/test_v112_vhf_intel.py \
            tests/test_v121_vhf_calibration.py \
            tests/test_v122_performance.py \
            tests/test_v123_digital_fastpath.py \
            tests/test_v124_display_logic.py \
            tests/test_v113_universal.py \
            tests/test_v1131_backup.py \
            tests/test_v1133_about.py \
            tests/test_v1134_version.py \
            tests/test_v1135_update_permissions.py \
            tests/test_v1138_rbn_nodes.py \
            tests/test_v1139_rbn_sync.py

      - name: Python syntax
        run: python -m py_compile app/main.py app/rbn_nodes.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py tools/build_release.py

      - name: Shell syntax
        run: bash -n install.sh hamspotter upgrade.sh upgrade_v*.sh

      - name: Release packaging smoke test
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py --output /tmp/hamspotter-dist
          cd /tmp/hamspotter-dist
          sha256sum -c SHA256SUMS.txt
          bash -n hamspotter-installer.sh
          ./hamspotter-installer.sh --verify
          unzip -t ham-spotter-universal.zip
