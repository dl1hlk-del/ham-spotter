name: Build and Publish Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Synchronize application version source
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path("app/main.py")
          text = p.read_text(encoding="utf-8")
          marker = 'Path(__file__).resolve().parents[1] / "VERSION"'
          if marker not in text:
              version = os.environ["VERSION"]
              replacement = (
                  "try:\n"
                  "    VERSION = (Path(__file__).resolve().parents[1] / \"VERSION\").read_text(encoding=\"utf-8\").strip() "
                  f"or \"{version}\"\n"
                  "except OSError:\n"
                  f"    VERSION = \"{version}\""
              )
              text, count = re.subn(
                  r'^VERSION = "[^"]+"$', replacement, text,
                  count=1, flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit("Could not locate application VERSION assignment")
              p.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- app/main.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/main.py
            git commit -m 'Read application version from VERSION file'
            git push
          fi

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Regression tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_v111_decision.py \
            tests/test_v112_vhf_intel.py \
            tests/test_v121_vhf_calibration.py \
            tests/test_v122_performance.py \
            tests/test_v123_digital_fastpath.py \
            tests/test_v124_display_logic.py \
            tests/test_v113_universal.py \
            tests/test_v1131_backup.py

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/main.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py tools/build_release.py
          bash -n install.sh hamspotter upgrade.sh "upgrade_v${{ steps.version.outputs.version }}.sh"

      - name: Build release assets
        run: python tools/build_release.py --output dist

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          bash -n hamspotter-installer.sh
          ./hamspotter-installer.sh --verify
          unzip -t ham-spotter-universal.zip

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES_${VERSION}.md"
          test -f "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/hamspotter-installer.sh \
            dist/ham-spotter-universal.zip \
            dist/SHA256SUMS.txt \
            --title "HAM Spotter ${VERSION}" \
            --notes-file "$NOTES" \
            --latest
