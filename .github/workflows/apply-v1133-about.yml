name: Apply V1.13.3 About Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1133-about.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply About and attribution changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Marker not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          root = Path('.')
          current = (root / 'VERSION').read_text(encoding='utf-8').strip()
          if current == '1.13.3':
              print('V1.13.3 is already applied.')
              raise SystemExit(0)
          if current != '1.13.2':
              raise SystemExit(f'Expected VERSION 1.13.2, found {current}')

          # Management: About command + menu item.
          manager = Path('tools/hamspotter_manager.py')
          text = manager.read_text(encoding='utf-8')
          about_func = '''\n\ndef about() -> None:\n    heading("Über HAM Spotter")\n    print("HAM Spotter")\n    print(f"Version: {version()}")\n    print("Urheber / Maintainer: DL1HLK")\n    print("Copyright © 2026 DL1HLK")\n    print("Lizenz: GNU General Public License v3.0 only (GPL-3.0-only)")\n    print("Freie Open-Source-Software für den Amateurfunk.")\n    print("Projekt: https://github.com/dl1hlk-del/ham-spotter")\n'''
          if 'def about() -> None:' not in text:
              marker = '\n\ndef menu() -> None:\n'
              if marker not in text:
                  raise SystemExit('Manager menu marker not found')
              text = text.replace(marker, about_func + marker, 1)

          old_menu = '''        print("8  Healthcheck")\n        print("9  Deinstallation")\n        print("0  Ende")'''
          new_menu = '''        print("8  Healthcheck")\n        print("9  Über HAM Spotter")\n        print("10 Deinstallation")\n        print("0  Ende")'''
          if new_menu not in text:
              if old_menu not in text:
                  raise SystemExit('Manager menu entries marker not found')
              text = text.replace(old_menu, new_menu, 1)

          old_dispatch = '''            elif choice == "8": healthcheck()\n            elif choice == "9": uninstall(); return\n            else: print("Ungültige Auswahl.")'''
          new_dispatch = '''            elif choice == "8": healthcheck()\n            elif choice == "9": about()\n            elif choice == "10": uninstall(); return\n            else: print("Ungültige Auswahl.")'''
          if new_dispatch not in text:
              if old_dispatch not in text:
                  raise SystemExit('Manager menu dispatch marker not found')
              text = text.replace(old_dispatch, new_dispatch, 1)

          old_parser = '''    sub.add_parser("healthcheck")\n    sub.add_parser("uninstall")\n    sub.add_parser("version")'''
          new_parser = '''    sub.add_parser("healthcheck")\n    sub.add_parser("about")\n    sub.add_parser("uninstall")\n    sub.add_parser("version")'''
          if new_parser not in text:
              if old_parser not in text:
                  raise SystemExit('Manager parser marker not found')
              text = text.replace(old_parser, new_parser, 1)

          old_main = '''        elif cmd == "healthcheck": return 0 if healthcheck() else 1\n        elif cmd == "uninstall": uninstall()\n        elif cmd == "version": print(version())'''
          new_main = '''        elif cmd == "healthcheck": return 0 if healthcheck() else 1\n        elif cmd == "about": about()\n        elif cmd == "uninstall": uninstall()\n        elif cmd == "version": print(version())'''
          if new_main not in text:
              if old_main not in text:
                  raise SystemExit('Manager command dispatch marker not found')
              text = text.replace(old_main, new_main, 1)
          manager.write_text(text, encoding='utf-8')

          # English translations for the new About screen.
          i18n = Path('tools/hamspotter_manager_i18n.py')
          text = i18n.read_text(encoding='utf-8')
          marker = '    ("Deinstallation", "Uninstall"),\n'
          additions = (
              marker
              + '    ("Über HAM Spotter", "About HAM Spotter"),\n'
              + '    ("Urheber / Maintainer", "Author / Maintainer"),\n'
              + '    ("Lizenz", "License"),\n'
              + '    ("Freie Open-Source-Software für den Amateurfunk.", "Free and open-source amateur-radio software."),\n'
              + '    ("Projekt", "Project"),\n'
          )
          if '("Über HAM Spotter", "About HAM Spotter")' not in text:
              if marker not in text:
                  raise SystemExit('i18n insertion marker not found')
              text = text.replace(marker, additions, 1)
          i18n.write_text(text, encoding='utf-8')

          # Dashboard attribution footer.
          main = Path('app/main.py')
          text = main.read_text(encoding='utf-8')
          footer = "<div class='footer'>Auto-Refresh alle 30 Sekunden · Historie bleibt in SQLite erhalten, auch wenn Roh-Spots nach {int(settings.retention_hours)} Stunden gelöscht werden.</div>"
          footer_new = footer + "\n<div class='footer' style='margin-top:10px'>HAM Spotter {html.escape(VERSION)} · Copyright © 2026 DL1HLK · GNU GPL v3.0 only · <a href='https://github.com/dl1hlk-del/ham-spotter' target='_blank' rel='noopener' style='color:#cfe8ff'>GitHub</a></div>"
          if 'Copyright © 2026 DL1HLK' not in text:
              if footer not in text:
                  raise SystemExit('Dashboard footer marker not found')
              text = text.replace(footer, footer_new, 1)
          main.write_text(text, encoding='utf-8')

          # README menus, commands and release version.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8').replace('**Current release:** 1.13.2', '**Current release:** 1.13.3')
          text = text.replace('''8  Healthcheck\n9  Uninstall\n0  Exit''', '''8  Healthcheck\n9  About HAM Spotter\n10 Uninstall\n0  Exit''')
          if 'hamspotter about' not in text:
              text = text.replace('hamspotter healthcheck\nhamspotter version', 'hamspotter healthcheck\nhamspotter about\nhamspotter version')
          readme.write_text(text, encoding='utf-8')

          readme_de = Path('README.de.md')
          text = readme_de.read_text(encoding='utf-8').replace('**Aktuelle Version:** 1.13.2', '**Aktuelle Version:** 1.13.3')
          text = text.replace('''8  Healthcheck\n9  Deinstallation\n0  Ende''', '''8  Healthcheck\n9  Über HAM Spotter\n10 Deinstallation\n0  Ende''')
          if 'hamspotter about' not in text:
              text = text.replace('hamspotter healthcheck\nhamspotter version', 'hamspotter healthcheck\nhamspotter about\nhamspotter version')
          readme_de.write_text(text, encoding='utf-8')

          # Changelog.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          section = '''## 1.13.3 — 2026-08-17\n\n### Added\n- `hamspotter about` with version, maintainer, copyright, GPL license and project URL.\n- About / Über HAM Spotter entry in the interactive management menu.\n- Discreet dashboard footer with version, copyright, GPL attribution and GitHub project link.\n\n### Changed\n- Management menu keeps English/German translation support for the new About information.\n\n'''
          if '## 1.13.3 —' not in text:
              pos = text.find('## ')
              if pos < 0:
                  raise SystemExit('CHANGELOG section marker not found')
              text = text[:pos] + section + text[pos:]
          changelog.write_text(text, encoding='utf-8')

          # Example config heading.
          env_example = Path('.env.example')
          text = env_example.read_text(encoding='utf-8').replace('# HAM Spotter V1.13.2 — Universal configuration', '# HAM Spotter V1.13.3 — Universal configuration')
          env_example.write_text(text, encoding='utf-8')

          # Upgrade helper and default upgrade pointer.
          Path('upgrade_v1.13.3.sh').write_text('''#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\n\nSTAMP="$(date +%Y%m%d-%H%M%S)"\nmkdir -p backups data\nchmod 700 backups 2>/dev/null || true\n\nif [[ -f .env ]]; then\n  cp -a .env "backups/.env.pre-v1.13.3-${STAMP}"\n  chmod 600 "backups/.env.pre-v1.13.3-${STAMP}" 2>/dev/null || true\nfi\n\nchmod +x hamspotter install.sh tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py 2>/dev/null || true\n\necho "HAM Spotter V1.13.3 – About & Attribution installed."\necho "New command: hamspotter about"\necho "Existing .env/data remain unchanged."\n''', encoding='utf-8')
          Path('upgrade.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\nexec ./upgrade_v1.13.3.sh\n', encoding='utf-8')

          # Release notes.
          Path('RELEASE_NOTES_1.13.3.md').write_text('''# HAM Spotter 1.13.3\n\nAbout and attribution release.\n\n## Highlights\n\n- new `hamspotter about` command\n- new **About HAM Spotter / Über HAM Spotter** management-menu entry\n- version, maintainer and copyright information\n- explicit GNU GPL v3.0 only attribution\n- discreet dashboard footer with project link\n- English/German manager translation support retained\n\n## About information\n\nThe management command now shows:\n\n```text\nHAM Spotter\nVersion: 1.13.3\nAuthor / Maintainer: DL1HLK\nCopyright © 2026 DL1HLK\nLicense: GNU General Public License v3.0 only (GPL-3.0-only)\nProject: https://github.com/dl1hlk-del/ham-spotter\n```\n\nHAM Spotter remains free and open-source software under GPL-3.0-only.\n\n## Installation\n\nDownload **`hamspotter-installer.sh`**, then:\n\n```bash\nchmod +x hamspotter-installer.sh\n./hamspotter-installer.sh\n```\n\n## Existing installations\n\nThe V1.13.3 upgrade preserves `.env` and runtime data.\n''', encoding='utf-8')

          # Regression test for attribution surfaces.
          Path('tests/test_v1133_about.py').write_text('''from pathlib import Path\nimport importlib.util\n\n\ndef _load_module(path: Path, name: str):\n    spec = importlib.util.spec_from_file_location(name, path)\n    mod = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(mod)\n    return mod\n\n\ndef test_manager_about_contains_project_attribution(tmp_path, capsys):\n    root = Path(__file__).resolve().parents[1]\n    mod = _load_module(root / "tools" / "hamspotter_manager.py", "hamspotter_manager_about_test")\n    version_file = tmp_path / "VERSION"\n    version_file.write_text("1.13.3\\n", encoding="utf-8")\n    mod.VERSION_FILE = version_file\n    mod.about()\n    out = capsys.readouterr().out\n    assert "HAM Spotter" in out\n    assert "1.13.3" in out\n    assert "DL1HLK" in out\n    assert "GPL-3.0-only" in out\n    assert "github.com/dl1hlk-del/ham-spotter" in out\n\n\ndef test_dashboard_contains_discreet_copyright_footer():\n    root = Path(__file__).resolve().parents[1]\n    text = (root / "app" / "main.py").read_text(encoding="utf-8")\n    assert "Copyright © 2026 DL1HLK" in text\n    assert "GNU GPL v3.0 only" in text\n    assert "github.com/dl1hlk-del/ham-spotter" in text\n\n\ndef test_bilingual_about_translation_is_present():\n    root = Path(__file__).resolve().parents[1]\n    text = (root / "tools" / "hamspotter_manager_i18n.py").read_text(encoding="utf-8")\n    assert '("Über HAM Spotter", "About HAM Spotter")' in text\n    assert '("Urheber / Maintainer", "Author / Maintainer")' in text\n''', encoding='utf-8')

          # Include the new regression in both CI and release verification.
          for workflow in (Path('.github/workflows/tests.yml'), Path('.github/workflows/release.yml')):
              text = workflow.read_text(encoding='utf-8')
              if 'tests/test_v1133_about.py' not in text:
                  marker = '            tests/test_v1131_backup.py'
                  if marker not in text:
                      raise SystemExit(f'Regression-list marker not found in {workflow}')
                  text = text.replace(marker, marker + ' \\\n            tests/test_v1133_about.py', 1)
              workflow.write_text(text, encoding='utf-8')

          tests_workflow = Path('.github/workflows/tests.yml')
          text = tests_workflow.read_text(encoding='utf-8').replace('upgrade_v1.13.2.sh', 'upgrade_v1.13.3.sh')
          tests_workflow.write_text(text, encoding='utf-8')

          # Version last: pushing this commit triggers the standard release workflow.
          Path('VERSION').write_text('1.13.3\n', encoding='utf-8')
          PY

      - name: Run regression tests
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          PYTHONPATH=. pytest -q \
            tests/test_v111_decision.py \
            tests/test_v112_vhf_intel.py \
            tests/test_v121_vhf_calibration.py \
            tests/test_v122_performance.py \
            tests/test_v123_digital_fastpath.py \
            tests/test_v124_display_logic.py \
            tests/test_v113_universal.py \
            tests/test_v1131_backup.py \
            tests/test_v1133_about.py

      - name: Syntax and release packaging checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/main.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py tools/build_release.py
          bash -n install.sh hamspotter upgrade.sh upgrade_v1.13.3.sh
          rm -rf dist
          python tools/build_release.py --output dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          bash -n hamspotter-installer.sh
          ./hamspotter-installer.sh --verify
          unzip -t ham-spotter-universal.zip

      - name: Commit V1.13.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md README.md README.de.md .env.example \
            app/main.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py \
            tests/test_v1133_about.py upgrade.sh upgrade_v1.13.3.sh RELEASE_NOTES_1.13.3.md \
            .github/workflows/tests.yml .github/workflows/release.yml
          git commit -m 'Add HAM Spotter About and copyright information'
          git push
