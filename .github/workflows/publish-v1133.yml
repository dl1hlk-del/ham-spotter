name: Publish V1.13.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1133.yml'

permissions:
  contents: write

jobs:
  publish-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Regression tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_v111_decision.py \
            tests/test_v112_vhf_intel.py \
            tests/test_v121_vhf_calibration.py \
            tests/test_v122_performance.py \
            tests/test_v123_digital_fastpath.py \
            tests/test_v124_display_logic.py \
            tests/test_v113_universal.py \
            tests/test_v1131_backup.py \
            tests/test_v1133_about.py

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.13.3"
          python -m py_compile app/main.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py tools/build_release.py
          bash -n install.sh hamspotter upgrade.sh upgrade_v1.13.3.sh
          rm -rf dist
          python tools/build_release.py --output dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          bash -n hamspotter-installer.sh
          ./hamspotter-installer.sh --verify
          unzip -t ham-spotter-universal.zip

      - name: Publish V1.13.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.13.3 >/dev/null 2>&1; then
            echo 'Release v1.13.3 already exists.'
          else
            gh release create v1.13.3 \
              dist/hamspotter-installer.sh \
              dist/ham-spotter-universal.zip \
              dist/SHA256SUMS.txt \
              --title 'HAM Spotter 1.13.3' \
              --notes-file RELEASE_NOTES_1.13.3.md \
              --latest
          fi

      - name: Download public release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hamspotter-public
          cd /tmp/hamspotter-public
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.13.3"
          curl -fL --retry 5 --retry-delay 2 "$BASE/hamspotter-installer.sh" -o hamspotter-installer.sh
          curl -fL --retry 5 --retry-delay 2 "$BASE/ham-spotter-universal.zip" -o ham-spotter-universal.zip
          curl -fL --retry 5 --retry-delay 2 "$BASE/SHA256SUMS.txt" -o SHA256SUMS.txt
          chmod +x hamspotter-installer.sh
          sha256sum -c SHA256SUMS.txt
          ./hamspotter-installer.sh --verify

      - name: Fresh English installation from public release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/ham-spotter"
          printf '1\n\nDL0TEST\nJO00AA\n\n\n\n1\n18095\n325\nEtc/UTC\nn\n' \
            | /tmp/hamspotter-public/hamspotter-installer.sh

      - name: Verify installed V1.13.3 and About information
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18095/health > /tmp/health.json; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker logs ham-spotter || true
              exit 1
            fi
            sleep 2
          done
          cat /tmp/health.json
          test "$(hamspotter version)" = "1.13.3"
          grep -q '^HAMSPOTTER_LANGUAGE=en$' "$HOME/ham-spotter/.env"
          hamspotter about | tee /tmp/about.txt
          grep -q 'DL1HLK' /tmp/about.txt
          grep -q 'GPL-3.0-only' /tmp/about.txt
          grep -q 'github.com/dl1hlk-del/ham-spotter' /tmp/about.txt
          docker inspect --format '{{.State.Health.Status}}' ham-spotter | grep -q '^healthy$'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -d "$HOME/ham-spotter" ]]; then
            cd "$HOME/ham-spotter"
            docker compose down -v --remove-orphans || true
          fi
          sudo rm -f /usr/local/bin/hamspotter || true
          rm -rf "$HOME/ham-spotter" /tmp/hamspotter-public /tmp/health.json /tmp/about.txt
