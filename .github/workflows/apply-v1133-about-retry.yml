name: Apply V1.13.3 About Update Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1133-about-retry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply About and attribution changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          current = Path('VERSION').read_text(encoding='utf-8').strip()
          if current == '1.13.3':
              print('V1.13.3 is already applied.')
              raise SystemExit(0)
          if current != '1.13.2':
              raise SystemExit(f'Expected VERSION 1.13.2, found {current}')

          manager = Path('tools/hamspotter_manager.py')
          text = manager.read_text(encoding='utf-8')
          if 'def about() -> None:' not in text:
              marker = '\n\ndef menu() -> None:\n'
              about_func = '''\n\ndef about() -> None:\n    heading("Über HAM Spotter")\n    print("HAM Spotter")\n    print(f"Version: {version()}")\n    print("Urheber / Maintainer: DL1HLK")\n    print("Copyright © 2026 DL1HLK")\n    print("Lizenz: GNU General Public License v3.0 only (GPL-3.0-only)")\n    print("Freie Open-Source-Software für den Amateurfunk.")\n    print("Projekt: https://github.com/dl1hlk-del/ham-spotter")\n'''
              if marker not in text:
                  raise SystemExit('Manager menu marker not found')
              text = text.replace(marker, about_func + marker, 1)
          text = text.replace('''        print("8  Healthcheck")\n        print("9  Deinstallation")\n        print("0  Ende")''', '''        print("8  Healthcheck")\n        print("9  Über HAM Spotter")\n        print("10 Deinstallation")\n        print("0  Ende")''', 1)
          text = text.replace('''            elif choice == "8": healthcheck()\n            elif choice == "9": uninstall(); return\n            else: print("Ungültige Auswahl.")''', '''            elif choice == "8": healthcheck()\n            elif choice == "9": about()\n            elif choice == "10": uninstall(); return\n            else: print("Ungültige Auswahl.")''', 1)
          text = text.replace('''    sub.add_parser("healthcheck")\n    sub.add_parser("uninstall")\n    sub.add_parser("version")''', '''    sub.add_parser("healthcheck")\n    sub.add_parser("about")\n    sub.add_parser("uninstall")\n    sub.add_parser("version")''', 1)
          text = text.replace('''        elif cmd == "healthcheck": return 0 if healthcheck() else 1\n        elif cmd == "uninstall": uninstall()\n        elif cmd == "version": print(version())''', '''        elif cmd == "healthcheck": return 0 if healthcheck() else 1\n        elif cmd == "about": about()\n        elif cmd == "uninstall": uninstall()\n        elif cmd == "version": print(version())''', 1)
          manager.write_text(text, encoding='utf-8')

          i18n = Path('tools/hamspotter_manager_i18n.py')
          text = i18n.read_text(encoding='utf-8')
          if '("Über HAM Spotter", "About HAM Spotter")' not in text:
              marker = '    ("Deinstallation", "Uninstall"),\n'
              add = marker + '    ("Über HAM Spotter", "About HAM Spotter"),\n    ("Urheber / Maintainer", "Author / Maintainer"),\n    ("Lizenz", "License"),\n    ("Freie Open-Source-Software für den Amateurfunk.", "Free and open-source amateur-radio software."),\n    ("Projekt", "Project"),\n'
              if marker not in text:
                  raise SystemExit('i18n marker not found')
              text = text.replace(marker, add, 1)
          i18n.write_text(text, encoding='utf-8')

          main = Path('app/main.py')
          text = main.read_text(encoding='utf-8')
          if 'Copyright © 2026 DL1HLK' not in text:
              footer = "<div class='footer'>Auto-Refresh alle 30 Sekunden · Historie bleibt in SQLite erhalten, auch wenn Roh-Spots nach {int(settings.retention_hours)} Stunden gelöscht werden.</div>"
              new = footer + "\n<div class='footer' style='margin-top:10px'>HAM Spotter {html.escape(VERSION)} · Copyright © 2026 DL1HLK · GNU GPL v3.0 only · <a href='https://github.com/dl1hlk-del/ham-spotter' target='_blank' rel='noopener' style='color:#cfe8ff'>GitHub</a></div>"
              if footer not in text:
                  raise SystemExit('Dashboard footer marker not found')
              text = text.replace(footer, new, 1)
          main.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8').replace('**Current release:** 1.13.2', '**Current release:** 1.13.3')
          text = text.replace('''8  Healthcheck\n9  Uninstall\n0  Exit''', '''8  Healthcheck\n9  About HAM Spotter\n10 Uninstall\n0  Exit''')
          if 'hamspotter about' not in text:
              text = text.replace('hamspotter healthcheck\nhamspotter version', 'hamspotter healthcheck\nhamspotter about\nhamspotter version')
          p.write_text(text, encoding='utf-8')

          p = Path('README.de.md')
          text = p.read_text(encoding='utf-8').replace('**Aktuelle Version:** 1.13.2', '**Aktuelle Version:** 1.13.3')
          text = text.replace('''8  Healthcheck\n9  Deinstallation\n0  Ende''', '''8  Healthcheck\n9  Über HAM Spotter\n10 Deinstallation\n0  Ende''')
          if 'hamspotter about' not in text:
              text = text.replace('hamspotter healthcheck\nhamspotter version', 'hamspotter healthcheck\nhamspotter about\nhamspotter version')
          p.write_text(text, encoding='utf-8')

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          if '## 1.13.3 —' not in text:
              section = '''## 1.13.3 — 2026-08-17\n\n### Added\n- `hamspotter about` with version, maintainer, copyright, GPL license and project URL.\n- About / Über HAM Spotter entry in the interactive management menu.\n- Discreet dashboard footer with version, copyright, GPL attribution and GitHub project link.\n\n### Changed\n- Management menu keeps English/German translation support for the new About information.\n\n'''
              pos = text.find('## ')
              if pos < 0:
                  raise SystemExit('CHANGELOG marker not found')
              text = text[:pos] + section + text[pos:]
          p.write_text(text, encoding='utf-8')

          p = Path('.env.example')
          p.write_text(p.read_text(encoding='utf-8').replace('# HAM Spotter V1.13.2 — Universal configuration', '# HAM Spotter V1.13.3 — Universal configuration'), encoding='utf-8')

          Path('upgrade_v1.13.3.sh').write_text('''#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\n\nSTAMP="$(date +%Y%m%d-%H%M%S)"\nmkdir -p backups data\nchmod 700 backups 2>/dev/null || true\nif [[ -f .env ]]; then\n  cp -a .env "backups/.env.pre-v1.13.3-${STAMP}"\n  chmod 600 "backups/.env.pre-v1.13.3-${STAMP}" 2>/dev/null || true\nfi\nchmod +x hamspotter install.sh tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py 2>/dev/null || true\necho "HAM Spotter V1.13.3 – About & Attribution installed."\necho "New command: hamspotter about"\necho "Existing .env/data remain unchanged."\n''', encoding='utf-8')
          Path('upgrade.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\nexec ./upgrade_v1.13.3.sh\n', encoding='utf-8')

          Path('RELEASE_NOTES_1.13.3.md').write_text('''# HAM Spotter 1.13.3\n\nAbout and attribution release.\n\n## Highlights\n- new `hamspotter about` command\n- new **About HAM Spotter / Über HAM Spotter** management-menu entry\n- version, maintainer and copyright information\n- explicit GNU GPL v3.0 only attribution\n- discreet dashboard footer with project link\n- English/German manager translation support retained\n\n## About information\n```text\nHAM Spotter\nVersion: 1.13.3\nAuthor / Maintainer: DL1HLK\nCopyright © 2026 DL1HLK\nLicense: GNU General Public License v3.0 only (GPL-3.0-only)\nProject: https://github.com/dl1hlk-del/ham-spotter\n```\n\nHAM Spotter remains free and open-source software under GPL-3.0-only.\n\n## Installation\nDownload **`hamspotter-installer.sh`**, then:\n```bash\nchmod +x hamspotter-installer.sh\n./hamspotter-installer.sh\n```\n\n## Existing installations\nThe V1.13.3 upgrade preserves `.env` and runtime data.\n''', encoding='utf-8')

          Path('tests/test_v1133_about.py').write_text('''from pathlib import Path\nimport importlib.util\n\ndef _load_module(path: Path, name: str):\n    spec = importlib.util.spec_from_file_location(name, path)\n    mod = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(mod)\n    return mod\n\ndef test_manager_about_contains_project_attribution(tmp_path, capsys):\n    root = Path(__file__).resolve().parents[1]\n    mod = _load_module(root / "tools" / "hamspotter_manager.py", "hamspotter_manager_about_test")\n    version_file = tmp_path / "VERSION"\n    version_file.write_text("1.13.3\\n", encoding="utf-8")\n    mod.VERSION_FILE = version_file\n    mod.about()\n    out = capsys.readouterr().out\n    assert "HAM Spotter" in out\n    assert "1.13.3" in out\n    assert "DL1HLK" in out\n    assert "GPL-3.0-only" in out\n    assert "github.com/dl1hlk-del/ham-spotter" in out\n\ndef test_dashboard_contains_discreet_copyright_footer():\n    root = Path(__file__).resolve().parents[1]\n    text = (root / "app" / "main.py").read_text(encoding="utf-8")\n    assert "Copyright © 2026 DL1HLK" in text\n    assert "GNU GPL v3.0 only" in text\n    assert "github.com/dl1hlk-del/ham-spotter" in text\n\ndef test_bilingual_about_translation_is_present():\n    root = Path(__file__).resolve().parents[1]\n    text = (root / "tools" / "hamspotter_manager_i18n.py").read_text(encoding="utf-8")\n    assert '("Über HAM Spotter", "About HAM Spotter")' in text\n    assert '("Urheber / Maintainer", "Author / Maintainer")' in text\n''', encoding='utf-8')

          Path('VERSION').write_text('1.13.3\n', encoding='utf-8')
          PY

      - name: Run regression tests
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          PYTHONPATH=. pytest -q \
            tests/test_v111_decision.py \
            tests/test_v112_vhf_intel.py \
            tests/test_v121_vhf_calibration.py \
            tests/test_v122_performance.py \
            tests/test_v123_digital_fastpath.py \
            tests/test_v124_display_logic.py \
            tests/test_v113_universal.py \
            tests/test_v1131_backup.py \
            tests/test_v1133_about.py

      - name: Syntax and package checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/main.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py tools/build_release.py
          bash -n install.sh hamspotter upgrade.sh upgrade_v1.13.3.sh
          rm -rf dist
          python tools/build_release.py --output dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          ./hamspotter-installer.sh --verify
          unzip -t ham-spotter-universal.zip

      - name: Commit V1.13.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md README.md README.de.md .env.example \
            app/main.py tools/hamspotter_manager.py tools/hamspotter_manager_i18n.py \
            tests/test_v1133_about.py upgrade.sh upgrade_v1.13.3.sh RELEASE_NOTES_1.13.3.md
          git commit -m 'Add HAM Spotter About and copyright information'
          git push
